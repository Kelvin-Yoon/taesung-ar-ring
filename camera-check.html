<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>태성고 카메라 점검</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}header{position:fixed;top:0;left:0;right:0;z-index:5;padding:18px;background:linear-gradient(#001e35ef,transparent)}#state{font-size:14px}footer{position:fixed;bottom:15px;left:12px;right:12px;z-index:5;text-align:center}button{border:0;background:#268cdb;color:white;padding:15px 20px;border-radius:14px;font-weight:bold;font-size:16px}
</style></head><body><video id="feed" autoplay muted playsinline webkit-playsinline></video><header><strong>TAESUNG · 카메라 단독 점검</strong><div id="state">아래 버튼을 눌러 후면 카메라를 실행하세요.</div></header><footer><button id="go">후면 카메라 켜기</button></footer><script>
const v=document.getElementById('feed'),s=document.getElementById('state');
document.getElementById('go').addEventListener('click',async()=>{try{const st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});v.srcObject=st;await v.play();s.textContent='카메라 영상 실행 중 '+v.videoWidth+'×'+v.videoHeight+' (표시되면 브라우저 카메라는 정상입니다)';document.getElementById('go').textContent='카메라 정상 확인';}catch(e){s.textContent='카메라 실행 오류: '+e.name+' — '+e.message;}});
</script></body></html>
