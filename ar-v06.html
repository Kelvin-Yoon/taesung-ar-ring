<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#061327"/>
<title>태성고 AR 링 · 화면비 보정 v0.6</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
<script src="./ar.js"></script>
<style>
*{box-sizing:border-box}html,body{padding:0;margin:0;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
#hud{position:fixed;top:0;left:0;right:0;z-index:99999;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(2,12,28,.91),rgba(3,13,28,.65) 72%,transparent);pointer-events:none}
#hud>*{pointer-events:auto}a.back{font-size:13px;font-weight:800;text-decoration:none;color:#e8f5ff;border:1px solid #43648b;border-radius:25px;padding:10px 13px;background:#102a4b}
#hud .brand{font-size:14px;font-weight:800;letter-spacing:.03em}#infoBtn{color:#fff;background:#0b305a;border:1px solid #487cb9;border-radius:30px;padding:9px 13px;font-weight:700}
#statusBar{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:99999;text-align:center;pointer-events:none}
#statusBar .pill{display:inline-block;border:1px solid rgba(120,175,238,.40);background:rgba(6,22,42,.89);border-radius:40px;max-width:98%;padding:13px 17px;font-weight:700;font-size:13px;line-height:1.45}
#statusBar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffb547;margin-right:6px}body.tracked #statusBar .dot{background:#4bd99f}
#tips{display:none;position:fixed;left:12px;right:12px;top:calc(78px + env(safe-area-inset-top));z-index:99999;background:#092849ef;border:1px solid #416c9c;border-radius:18px;padding:16px;line-height:1.8;font-size:13px}
#tips.show{display:block}#tips img{float:right;width:86px;margin:0 0 10px 10px;border-radius:6px}
/* FIX v0.4: AR.js places its camera <video> behind the page by default.
   The opaque navy body background previously hid the live camera feed. */
html{background:#000!important}
body{background:transparent!important}
/* Keep camera video visible below the transparent WebGL canvas. */
video#arjs-video,video.arjs-video,body>video{z-index:0!important;visibility:visible!important;opacity:1!important}
a-scene{position:fixed !important;inset:0;z-index:1!important;background:transparent!important}
a-scene canvas.a-canvas{background:transparent!important}
.a-enter-vr,.a-enter-ar{display:none!important}

/* v0.5: camera preview is explicitly layered behind transparent A-Frame WebGL.
   This fixes devices which place AR.js's own video behind an opaque page. */
html, body { background:#000 !important; }
#cameraPreview {
  position:fixed !important; inset:0 !important; width:100vw !important; height:100dvh !important;
  object-fit:cover; background:#000; z-index:0 !important; pointer-events:none;
  display:block !important; opacity:1 !important; transform:translateZ(0);
}
/* Fall back to the AR.js-owned video until our mirrored preview is playing. */
video#arjs-video,video.arjs-video{z-index:0!important;visibility:visible!important;}
body.preview-ready video#arjs-video,body.preview-ready video.arjs-video{opacity:0!important;pointer-events:none!important;}
a-scene { z-index:1 !important; background:transparent !important; }
a-scene canvas.a-canvas {background:transparent!important;opacity:1!important;}
#cameraDiag{display:none;position:fixed;top:calc(77px + env(safe-area-inset-top));left:12px;right:12px;z-index:999999;
  border:1px solid #62a3ea;border-radius:16px;background:rgba(3,20,40,.95);color:#e8f4ff;padding:13px;
  font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;}
#cameraDiag.open{display:block}
#diagBtn{color:#fff;background:#143957;border:1px solid #487cb9;border-radius:30px;padding:9px 10px;font-weight:700;font-size:12px}


/* v0.6 — aspect-safe AR.js compositor.
   A WebGL canvas can be displayed at full portrait aspect although its projection
   matrix was calibrated for a landscape image; stretching distorts a wide logo.
   Set both the camera preview AND overlay canvas into the same measured stage. */
#fitBtn{color:#fff;background:#205885;border:1px solid #65a1de;border-radius:22px;padding:9px 10px;font-size:12px;font-weight:700}
#cameraPreview{object-fit:cover!important;border:0;margin:0!important;transform:none!important;}
a-scene{overflow:hidden!important; width:100vw!important; height:100dvh!important;}
a-scene canvas.a-canvas{position:absolute!important;max-width:none!important;max-height:none!important;transform:none!important;object-fit:fill!important;}
#sizeTools{position:fixed;z-index:99999;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:6px 9px;border-radius:40px;background:rgba(4,20,39,.85);border:1px solid #41698a;white-space:nowrap}
#sizeTools button{width:33px;height:31px;line-height:26px;border-radius:100px;border:1px solid #6baae0;background:#164775;color:white;font-size:20px;font-weight:700;cursor:pointer}
#sizeTools small{font-size:11px;color:#c6e6ff}
#sizeTools button:focus-visible,#fitBtn:focus-visible{outline:2px solid white;outline-offset:2px}
#cameraDiag{max-height:55dvh;overflow-y:auto}
@media(max-width:400px){#hud{padding-left:8px;padding-right:8px}#hud .brand{font-size:11px}#hud button{font-size:11px}}
</style>
</head>
<body>
<div id="hud"><a class="back" href="./index.html">← 안내</a><div class="brand">TAESUNG · AR RING <span style="color:#8ccaff;font-size:11px">v0.6</span></div><div style="display:flex;gap:6px"><button id="fitBtn" type="button">화면: 전체</button><button id="diagBtn" type="button">진단</button><button id="infoBtn" type="button">사용 방법</button></div></div>
<div id="tips"><img src="./assets/taesung-marker.png" alt="태성 로고 마커"/><strong>인식이 잘 안 된다면</strong><div>① 조명 밝은 곳에서 흰색 여백과 검정 테두리 전체가 보이게 촬영<br>② 먼저 출력한 80mm 카드로 시험<br>③ 15–25cm 간격에서 천천히 움직이기<br>④ 카메라를 가린 손가락을 치우기<br>⑤ 브라우저 카메라 권한 허용</div></div>
<div id="statusBar"><span class="pill"><span class="dot"></span><span id="state">AR 엔진 시작 중…</span></span></div>
<div id="sizeTools"><button type="button" id="smaller" aria-label="로고 축소">−</button><small id="sizeIndicator">로고 70%</small><button type="button" id="larger" aria-label="로고 확대">+</button></div>
<video id="cameraPreview" autoplay muted playsinline webkit-playsinline disablepictureinpicture aria-hidden="true"></video>
<div id="cameraDiag" aria-live="polite">카메라 진단 준비 중…</div>
<a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" renderer="alpha: true; antialias: true; colorManagement: true; precision: medium" arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: color_and_matrix; patternRatio: 0.60; maxDetectionRate: 30;" loading-screen="enabled:false">
  <a-marker id="ringMarker" type="pattern" url="./assets/taesung.patt" emitevents="true" smooth="true" smoothCount="6" smoothTolerance="0.02" smoothThreshold="3">
    <a-entity id="billboard" position="0 0 0" ar-billboard>
      <!-- One outer wrapper controls logo size without fighting the animation in ar.js -->
      <a-entity id="logoMount" position="0 -0.10 0" scale="0.70 0.70 0.70">
        <a-entity id="logo" position="0 .82 0" logo-geometry ar-logo-animation></a-entity>
      </a-entity>
    </a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>



<script>
/* v0.6 — camera and WebGL share one layout rectangle at projection's native aspect.
   Standalone HTML change: original ar.js assets remain untouched. */
(()=>{
 'use strict';
 const $=(selector)=>document.querySelector(selector);
 const scene=$('a-scene'),preview=$('#cameraPreview'),state=$('#state');
 const diag=$('#cameraDiag');
 const fitBtn=$('#fitBtn');
 const mount=$('#logoMount');
 let source=null,stream=null,starting=false,lastErr='',fit='contain',zoom=.70;
 let stageW=0,stageH=0,projAspect=4/3,projectionRaw=0;
 let previewStarted=false,lastLayout='',start=performance.now();

 function arSource(){
   const named=document.querySelector('#arjs-video');
   if(named?.tagName==='VIDEO')return named;
   return [...document.querySelectorAll('video')].find(v=>v!==preview&&v.srcObject)||null;
 }
 async function reuseCamera(){
   if(starting) return;
   const found=arSource();if(!found)return;
   source=found;
   if(found.srcObject && found.srcObject!==stream){
     starting=true;
     try{
       preview.srcObject=found.srcObject;
       await preview.play();
       stream=found.srcObject;
     }catch(e){lastErr='camera preview '+e.name+': '+e.message;}
     finally{starting=false;}
   }
 }
 function aspectFromProjection(){
   const camera=scene?.camera;
   const p=camera?.projectionMatrix?.elements;
   if(p && Number.isFinite(p[0]) && Number.isFinite(p[5]) && Math.abs(p[0])>0.001){
     const r=Math.abs(p[5]/p[0]);
     if(r>.4&&r<2.4){projectionRaw=r;return r;}
   }
   // Before AR.js projection is installed, fall back to the camera frame aspect.
   const v=source||preview;
   if(v.videoWidth>0&&v.videoHeight>0){const r=v.videoWidth/v.videoHeight;if(r>.4&&r<2.4)return r;}
   return 4/3;
 }
 function layout(){
   if(!scene||!preview)return;
   const vw=window.innerWidth,vh=window.innerHeight;
   const canvas=scene.canvas||scene.querySelector('canvas.a-canvas');
   projAspect=aspectFromProjection();
   if(!canvas)return;
   const ratio=projAspect;
   // Letterbox for full-view mode; crop symmetrically for fill mode.
   stageH = fit==='cover' ? Math.max(vh,vw/ratio) : Math.min(vh,vw/ratio);
   stageW = stageH * ratio;
   const x=(vw-stageW)/2,y=(vh-stageH)/2;
   const key=[vw,vh,fit,ratio.toFixed(3),canvas.width,canvas.height].join(':');
   if(key!==lastLayout){
     // Respect the natural optics ratio rather than stretching AR.js's 640x480 projection across a 9:20 viewport.
     const styles={position:'absolute',width:stageW+'px',height:stageH+'px',left:x+'px',top:y+'px',right:'auto',bottom:'auto',maxWidth:'none',maxHeight:'none',margin:'0',transform:'none',background:'transparent'};
     for(const [k,v]of Object.entries(styles))canvas.style.setProperty(k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase()),v,'important');
     preview.style.setProperty('width',stageW+'px','important');
     preview.style.setProperty('height',stageH+'px','important');
     preview.style.setProperty('left',x+'px','important');
     preview.style.setProperty('top',y+'px','important');
     // Both media elements are optically fitted in an identical outer rectangle.
     preview.style.setProperty('object-fit','cover','important');
     lastLayout=key;
   }
   if(scene.renderer){
     try{scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0);scene.object3D.background=null;}catch(e){lastErr='renderer: '+e.message;}
   }
 }
 function updateZoom(){
   if(mount?.object3D?.scale){const s=zoom;mount.object3D.scale.setScalar(s);}
   $('#sizeIndicator').textContent='로고 '+Math.round(zoom*100)+'%';
 }
 function report(){
   if(!diag)return;
   const c=scene?.canvas; const v=source;
   diag.textContent=
      '태성고 AR v0.6 · 화면비 진단\n'+
      '브라우저 화면: '+innerWidth+'×'+innerHeight+'\n'+
      '카메라 원본: '+(v?.videoWidth||0)+'×'+(v?.videoHeight||0)+'\n'+
      '미리보기: '+preview.videoWidth+'×'+preview.videoHeight+' / '+(preview.paused?'정지':'재생')+'\n'+
      '3D 캔버스 원본: '+(c?.width||0)+'×'+(c?.height||0)+'\n'+
      '카메라 투영 비율: '+projAspect.toFixed(3)+'\n'+
      '영상/3D 표시 영역: '+Math.round(stageW)+'×'+Math.round(stageH)+'\n'+
      '표시 방식: '+(fit==='contain'?'전체 보기':'화면 채움')+'\n'+
      '로고 크기: '+Math.round(zoom*100)+'%\n'+
      '마커: '+(document.body.classList.contains('tracked')?'인식':'대기')+
      (lastErr?'\n오류: '+lastErr:'');
 }
 function tick(){
   reuseCamera();layout();updateZoom();
   const ready=preview.readyState>=2 && !preview.paused && preview.videoWidth>0;
   document.body.classList.toggle('preview-ready',ready);
   if(ready&&!previewStarted){previewStarted=true;if(!document.body.classList.contains('tracked'))state.textContent='카메라 정상 · 마커를 비춰주세요';}
   if(!ready&&performance.now()-start>9000&&!document.body.classList.contains('tracked'))state.textContent='카메라 준비 지연 · 진단 버튼을 눌러주세요';
   if(diag.classList.contains('open'))report();
 }
 fitBtn.addEventListener('click',()=>{
   fit=fit==='contain'?'cover':'contain';
   fitBtn.textContent=fit==='contain'?'화면: 전체':'화면: 채움';
   lastLayout='';layout();report();
 });
 $('#smaller').addEventListener('click',()=>{zoom=Math.max(.30,Math.round((zoom-.10)*100)/100);updateZoom();report();});
 $('#larger').addEventListener('click',()=>{zoom=Math.min(1.30,Math.round((zoom+.10)*100)/100);updateZoom();report();});
 $('#diagBtn').addEventListener('click',()=>{diag.classList.toggle('open');report();});
 window.addEventListener('resize',()=>{lastLayout='';layout();});
 window.addEventListener('orientationchange',()=>{lastLayout='';});
 scene?.addEventListener('loaded',()=>{lastLayout='';layout();});
 scene?.addEventListener('renderstart',()=>{lastLayout='';layout();});
 preview.addEventListener('playing',()=>{lastLayout='';layout();});
 preview.addEventListener('error',()=>{lastErr=preview.error?.message||'camera error';report();});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastLayout='';preview.play().catch(()=>{});}});
 setInterval(tick,500);tick();
})();
</script>
</body>
</html>
