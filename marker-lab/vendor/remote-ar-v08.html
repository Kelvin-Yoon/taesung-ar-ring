<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#061327"/>
<title>태성고 AR 링 · 홀로그램 애니메이션 v0.8</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
<script src="./ar.js"></script>
<script>
/* TAESUNG AR Ring v0.8 — realtime Three.js hologram motion + particles.
   Does not replace marker detection or the existing traced 3D logo asset.
   Use one MediaStream (AR.js); no extra camera permission required. */
(() => {
  'use strict';
  if (!window.AFRAME || !window.THREE) return;
  const THREE = window.THREE;
  const TAU = Math.PI * 2;
  const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi,v));
  const ease = x => 1-Math.pow(1-clamp(x,0,1),3);

  function glowTexture(){
    const c=document.createElement('canvas'); c.width=c.height=128;
    const ctx=c.getContext('2d');
    const g=ctx.createRadialGradient(64,64,1,64,64,64);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(.22,'rgba(241,249,255,.55)');
    g.addColorStop(.60,'rgba(118,202,255,.16)');
    g.addColorStop(1,'rgba(48,153,255,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  function beamTexture(){
    const c=document.createElement('canvas'); c.width=128;c.height=256;
    const ctx=c.getContext('2d'), img=ctx.createImageData(128,256);
    for(let y=0;y<256;y++)for(let x=0;x<128;x++){
      const v=y/255, h=x/127-.5;
      const width=.13+.25*(1-v);
      const a=Math.exp(-Math.pow(h/width,2)*2.3)*Math.pow(v,.48)*.74;
      const i=(y*128+x)*4;
      img.data[i]=235;img.data[i+1]=246;img.data[i+2]=255;img.data[i+3]=Math.round(a*255);
    }
    ctx.putImageData(img,0,0);
    return new THREE.CanvasTexture(c);
  }


  AFRAME.registerComponent('mobile-ar-layout', {
    tick(){if(this.el.mobileLayout)this.el.mobileLayout();}
  });

  AFRAME.registerComponent('marker-ring-glow', {
    init(){
      const c=document.createElement('canvas');c.width=c.height=256;
      const ctx=c.getContext('2d');
      const g=ctx.createRadialGradient(128,128,0,128,128,128);
      g.addColorStop(0,'rgba(67,183,255,0)');
      g.addColorStop(.60,'rgba(67,183,255,0)');
      g.addColorStop(.70,'rgba(67,183,255,.22)');
      g.addColorStop(.735,'rgba(155,235,255,.85)');
      g.addColorStop(.78,'rgba(67,183,255,.25)');
      g.addColorStop(1,'rgba(67,183,255,0)');
      ctx.fillStyle=g;ctx.fillRect(0,0,256,256);
      this.texture=new THREE.CanvasTexture(c);
      this.material=new THREE.MeshBasicMaterial({map:this.texture,transparent:true,
        opacity:.85,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});
      this.geometry=new THREE.PlaneGeometry(1.90,1.90);
      this.mesh=new THREE.Mesh(this.geometry,this.material);
      this.mesh.rotation.x=-Math.PI/2;this.mesh.position.y=.018;
      this.el.object3D.add(this.mesh);
      this.reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    },
    tick(t){
      this.material.opacity=this.reducedMotion?.85:.75+.15*Math.sin(t*.002);
    },
    remove(){
      this.el.object3D.remove(this.mesh);
      this.geometry.dispose();this.material.dispose();this.texture.dispose();
    }
  });

  AFRAME.registerComponent('taesung-hologram', {
    init(){
      this.found=false;this.ready=false;this.seconds=0;this.bound=false;
      this.root=this.el.object3D;
      this.root.visible=false;
      this.assets=[];
      this.fxBase=new THREE.Group();
      const mount=document.getElementById('logoMount');
      (mount ? mount.object3D : this.root).add(this.fxBase);
      this.root.position.set(0,.15,0);
      // Soft white-to-blue light at the ring plus upward light gradient.
      const tex=glowTexture();
      this.glowMat=new THREE.SpriteMaterial({map:tex,color:0xf6fbff,transparent:true,opacity:0,
        depthWrite:false,blending:THREE.AdditiveBlending});
      const glow=new THREE.Sprite(this.glowMat);
      glow.position.set(0,.11,-.13);glow.scale.set(1.25,.68,1);
      this.fxBase.add(glow);
      this.beamMat=new THREE.MeshBasicMaterial({map:beamTexture(),transparent:true,opacity:0,
        depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});
      const beam=new THREE.Mesh(new THREE.PlaneGeometry(1.20,1.75),this.beamMat);
      beam.position.set(0,.73,-.20);this.fxBase.add(beam);
      this.fxBase.visible=false;

      // Two elliptical luminous orbital tracks around the rising wordmark.
      this.orbits=[];
      [[1.07,.35,-.22,0x60b9ff],[.99,.28,.20,0xd5f3ff]].forEach(([rx,ry,tilt,color]) => {
        const vertices=[];
        for(let j=0;j<=120;j++){
          const a=TAU*j/120;
          const x=rx*Math.cos(a), y=ry*Math.sin(a);
          vertices.push(x*Math.cos(tilt)-y*Math.sin(tilt),
                        x*Math.sin(tilt)+y*Math.cos(tilt), -.08);
        }
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
        const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity:0,
          depthWrite:false,blending:THREE.AdditiveBlending});
        const line=new THREE.Line(geo,mat);
        this.root.add(line);this.orbits.push({line,mat});
      });

      // Real-time 3D particles orbit significantly faster than the logo.
      const white=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,
        depthWrite:false,blending:THREE.AdditiveBlending});
      const blue=new THREE.MeshBasicMaterial({color:0x4ab8ff,transparent:true,opacity:0,
        depthWrite:false,blending:THREE.AdditiveBlending});
      const cyan=new THREE.MeshBasicMaterial({color:0x9eeeff,transparent:true,opacity:0,
        depthWrite:false,blending:THREE.AdditiveBlending});
      this.particleMats=[white,blue,cyan];
      this.particles=[];
      for(let i=0;i<38;i++){
        const size=(i%9===0? .070 : .017+(i*13%7)*.006);
        const geo=new THREE.BoxGeometry(size,size,size*.52);
        const mesh=new THREE.Mesh(geo,this.particleMats[i%3]);
        this.root.add(mesh);
        this.particles.push({mesh,index:i,phase:TAU*i/38,rx:.78+(i%7)*.05,
          ry:.27+(i%4)*.065,speed:(i%2===0?1:-1)*(1.60+(i%5)*.14)});
      }
      const wait=()=>this.bind();
      this.el.sceneEl.addEventListener('loaded',wait,{once:true});
      if(this.el.sceneEl.hasLoaded) this.bind();
    },
    bind(){
      if(this.bound)return;
      const marker=document.getElementById('ringMarker');
      const logo=document.getElementById('logo');
      const spin=document.getElementById('logoSpin');
      if(!marker||!logo||!spin){
        // A-Frame may initialize a parent before nested entities finish parsing.
        setTimeout(()=>this.bind(),150);
        return;
      }
      this.marker=marker;this.spin=spin.object3D;this.bound=true;
      logo.addEventListener('logo-ready',()=>{this.ready=true;});
      const component=logo.components['logo-geometry'];
      if(component && component.logoGroup && component.logoGroup.children.length>0) this.ready=true;
      marker.addEventListener('markerFound',()=>this.restart());
      marker.addEventListener('markerLost',()=>{
        this.found=false;this.root.visible=false;this.fxBase.visible=false;
        document.body.classList.remove('tracked');
        const state=document.getElementById('state');
        if(state)state.textContent='마커를 다시 비춰주세요';
      });
      const replay=document.getElementById('replayBtn');
      replay?.addEventListener('click',()=>{
        if(this.found)this.restart();
      });
    },
    restart(){
      this.seconds=0;this.found=true;this.root.visible=this.ready;
      this.fxBase.visible=true;
      if(this.spin){this.spin.rotation.set(0,-.22,0);this.spin.position.set(0,0,0);}
      document.body.classList.add('tracked');
      const state=document.getElementById('state');
      if(state)state.textContent='역사와 전통에 빛나는 태성';
    },
    tick(_t,dt){
      if(!this.found || !this.ready || !this.spin)return;
      if(!this.root.visible)this.root.visible=true;
      const delta=clamp((dt||0)/1000,0,.10);
      this.seconds+=delta;
      const t=this.seconds;
      const rise=ease(t/1.80);
      const fx=ease(t/.65);
      // Marker plane --> floating logo: translate upward while scaling in.
      this.root.position.y=.22+.73*rise+.026*Math.sin(t*1.6);
      this.root.scale.setScalar(.22+.78*ease(t/1.48));
      // 32 second rotation, much slower than 3–4 second particle circulation.
      this.spin.rotation.y=-.22+TAU*t/32;
      this.spin.rotation.z=.025*Math.sin(t*.60);
      this.glowMat.opacity=.43*fx;
      this.beamMat.opacity=.36*fx;
      for(let j=0;j<this.orbits.length;j++){
        const o=this.orbits[j];o.mat.opacity=(j===0?.52:.29)*fx;
        o.line.rotation.z=t*(j===0?.67:-.93);
      }
      for(const p of this.particles){
        const a=p.phase+t*p.speed;
        const x=p.rx*Math.cos(a), y=p.ry*Math.sin(a);
        p.mesh.position.set(x,y, .04+.14*Math.cos(a*1.21+p.index));
        p.mesh.rotation.z=a*.9;
        p.mesh.scale.setScalar(.66+.32*Math.sin(t*4+p.index)+.28);
      }
      this.particleMats.forEach((mat,i)=>mat.opacity=(.60+.18*Math.sin(t*3+i))*fx);
    },
    remove(){
      this.root.traverse(o=>{if(o.geometry && o!==this.spin)o.geometry.dispose?.();});
      this.particleMats.forEach(m=>m.dispose());
      this.beamMat.dispose();this.glowMat.dispose();
    }
  });
})();
</script>

<script>
/* v0.8 — camera and WebGL share one layout rectangle at projection's native aspect.
   Standalone HTML change: original ar.js assets remain untouched. */
(()=>{
 'use strict';
 const $=(selector)=>document.querySelector(selector);
 const scene=$('a-scene'),preview=$('#cameraPreview'),state=$('#state');
 const diag=$('#cameraDiag');
 const fitBtn=$('#fitBtn');
 const mount=$('#logoMount');
 let source=null,stream=null,starting=false,lastErr='',fit='cover',zoom=1.50;
 let stageW=0,stageH=0,projAspect=4/3,projectionRaw=0;
 let previewStarted=false,lastLayout='',qualityStatus='실시간 AR 카메라 준비 중',start=performance.now();
 const upgradedTracks=new WeakSet();

 function arSource(){
   const named=document.querySelector('#arjs-video');
   if(named?.tagName==='VIDEO')return named;
   return [...document.querySelectorAll('video')].find(v=>v!==preview&&v.srcObject)||null;
 }
 async function upgradeCamera(media){
   const track=media.getVideoTracks?.()[0];
   if(!track||upgradedTracks.has(track))return;
   upgradedTracks.add(track);
   if(typeof track.applyConstraints!=='function'){qualityStatus='브라우저 기본 해상도';return;}
   const previous=track.getConstraints?.()||{};
   try{
     // Cap camera pixels for realtime AR; never upgrade to the device maximum.
     await track.applyConstraints({...previous,width:{ideal:1280,max:1280},
       height:{ideal:960,max:960},aspectRatio:{ideal:4/3},
       frameRate:{ideal:30,max:30}});
     qualityStatus='실시간 AR · 최대 1280×960 / 30fps 요청';
   }catch(e){
     try{
       await track.applyConstraints({...previous,width:{ideal:640,max:640},
         height:{ideal:480,max:480},frameRate:{ideal:30,max:30}});
       qualityStatus='실시간 AR · 최대 640×480 대체 설정';
     }catch(fallback){qualityStatus='현재 카메라 해상도 유지';}
   }
   lastLayout='';layout();report();
 }
 async function reuseCamera(){
   if(starting) return;
   const found=arSource();if(!found)return;
   if(source!==found){source=found;found.addEventListener('resize',layout);found.addEventListener('loadedmetadata',layout);}
   if(found.srcObject && found.srcObject!==stream){
     starting=true;
     try{
       upgradeCamera(found.srcObject);
       preview.srcObject=found.srcObject;
       await preview.play();
       stream=found.srcObject;
     }catch(e){lastErr='camera preview '+e.name+': '+e.message;}
     finally{starting=false;}
   }
 }
 function aspectFromProjection(){
   const context=scene?.systems?.arjs?._arSession?.arContext;
   // Ignore A-Frame's temporary viewport camera until marker calibration is ready.
   const camera=scene?.camera;
   const p=context?.arController ? (context.getProjectionMatrix?.()?.elements||camera?.projectionMatrix?.elements) : null;
   if(p && Number.isFinite(p[0]) && Number.isFinite(p[5]) && Math.abs(p[0])>0.001){
     const r=Math.abs(p[5]/p[0]);
     if(r>.4&&r<2.4){projectionRaw=r;return r;}
   }
   // Before AR.js projection is installed, fall back to the camera frame aspect.
   const v=source||preview;
   if(v.videoWidth>0&&v.videoHeight>0){const r=v.videoWidth/v.videoHeight;if(r>.4&&r<2.4)return r;}
   return 4/3;
 }
 function layout(){
   if(!scene||!preview)return;
   const vw=document.documentElement.clientWidth||window.innerWidth;
   const vh=document.documentElement.clientHeight||window.innerHeight;
   const canvas=scene.canvas||scene.querySelector('canvas.a-canvas');
   const hud=$('#hud');
   if(hud)document.body.style.setProperty('--hud-bottom',Math.ceil(hud.getBoundingClientRect().bottom)+'px');
   projAspect=aspectFromProjection();
   if(!canvas)return;
   const ratio=projAspect;
   stageH=fit==='cover'?Math.max(vh,vw/ratio):Math.min(vh,vw/ratio);
   stageW=stageH*ratio;
   const x=(vw-stageW)/2,y=(vh-stageH)/2;
   const styles={position:'absolute',width:stageW+'px',height:stageH+'px',
     left:x+'px',top:y+'px',right:'auto',bottom:'auto',maxWidth:'none',maxHeight:'none',
     margin:'0px',marginLeft:'0px',marginTop:'0px',marginRight:'0px',marginBottom:'0px',
     transform:'none',background:'transparent'};
   // AR.js rewrites canvas/source margins on every resize. Reassert the shared
   // centered rectangle after AR system ticks, even when its dimensions are unchanged.
   for(const element of [canvas,preview,source]){
     if(!element)continue;
     for(const [k,v] of Object.entries(styles)){
       const name=k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase());
       const value=k==='position'&&element!==canvas?'fixed':v;
       if(element.style.getPropertyValue(name)!==value||element.style.getPropertyPriority(name)!=='important')
         element.style.setProperty(name,value,'important');
     }
   }
   preview.style.setProperty('object-fit','cover','important');
   lastLayout=[vw,vh,fit,ratio.toFixed(3)].join(':');
   if(scene.renderer){
     try{scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0);scene.object3D.background=null;}catch(e){lastErr='renderer: '+e.message;}
   }
 }
 scene.mobileLayout=layout;
 function updateZoom(){
   if(mount?.object3D?.scale){const s=zoom;mount.object3D.scale.setScalar(s);}
   $('#sizeIndicator').textContent='로고 '+Math.round(zoom*100)+'%';
 }
 function report(){
   if(!diag)return;
   const c=scene?.canvas; const v=source;
   const settings=stream?.getVideoTracks?.()[0]?.getSettings?.()||{};
   diag.textContent=
      '태성고 AR v0.8 · 3D 애니메이션 진단\n'+
      '브라우저 화면: '+innerWidth+'×'+innerHeight+'\n'+
      '카메라 원본: '+(v?.videoWidth||0)+'×'+(v?.videoHeight||0)+'\n'+
      '카메라 설정: '+qualityStatus+'\n'+
      '실제 촬영: '+(settings.width||0)+'×'+(settings.height||0)+' / '+(settings.frameRate||0)+'fps'+'\n'+
      '미리보기: '+preview.videoWidth+'×'+preview.videoHeight+' / '+(preview.paused?'정지':'재생')+'\n'+
      '3D 캔버스 원본: '+(c?.width||0)+'×'+(c?.height||0)+'\n'+
      '카메라 투영 비율: '+projAspect.toFixed(3)+'\n'+
      '영상/3D 표시 영역: '+Math.round(stageW)+'×'+Math.round(stageH)+'\n'+
      '표시 방식: '+(fit==='contain'?'전체 보기':'화면 채움')+'\n'+
      '로고 크기: '+Math.round(zoom*100)+'%\n'+
      '마커: '+(document.body.classList.contains('tracked')?'인식':'대기')+'\n효과: 상승 1.8초 / 로고 32초 회전 / 입자 빠른 공전'+
      (lastErr?'\n오류: '+lastErr:'');
 }
 function tick(){
   reuseCamera();layout();updateZoom();
   const ready=preview.readyState>=2 && !preview.paused && preview.videoWidth>0;
   document.body.classList.toggle('preview-ready',ready);
   if(ready&&!previewStarted){previewStarted=true;if(!document.body.classList.contains('tracked'))state.textContent='카메라 정상 · 마커를 비춰주세요';}
   if(!ready&&performance.now()-start>9000&&!document.body.classList.contains('tracked'))state.textContent='카메라 준비 지연 · 진단 버튼을 눌러주세요';
   if(diag.classList.contains('open'))report();
 }
 fitBtn.addEventListener('click',()=>{
   fit=fit==='contain'?'cover':'contain';
   fitBtn.textContent=fit==='contain'?'화면: 전체':'화면: 채움';
   lastLayout='';layout();report();
 });
 $('#smaller').addEventListener('click',()=>{zoom=Math.max(.30,Math.round((zoom-.10)*100)/100);updateZoom();report();});
 $('#larger').addEventListener('click',()=>{zoom=Math.min(2.00,Math.round((zoom+.10)*100)/100);updateZoom();report();});
 $('#diagBtn').addEventListener('click',()=>{diag.classList.toggle('open');report();});
 window.addEventListener('resize',()=>{lastLayout='';layout();});
 window.addEventListener('orientationchange',()=>{lastLayout='';setTimeout(layout,250);});
 window.visualViewport?.addEventListener('resize',layout);
 scene?.addEventListener('loaded',()=>{lastLayout='';layout();});
 scene?.addEventListener('renderstart',()=>{lastLayout='';layout();});
 preview.addEventListener('resize',()=>{lastLayout='';layout();});
 preview.addEventListener('playing',()=>{lastLayout='';layout();});
 preview.addEventListener('error',()=>{lastErr=preview.error?.message||'camera error';report();});
 document.addEventListener('pointerdown',()=>{
   if(preview.paused&&preview.srcObject)preview.play().catch(()=>{});
 },{passive:true});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastLayout='';preview.play().catch(()=>{});}});
 setInterval(tick,500);tick();
})();
</script>
</body>
